<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 300px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 13px;
    color: #1a1a1a;
    background: #fff;
    padding: 16px;
  }

  .header { display:flex;align-items:center;gap:10px;margin-bottom:14px; }
  .logo { width:32px;height:32px;border-radius:8px;background:#0f6cbd;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0; }
  .title { font-weight:600;font-size:14px; }
  .subtitle { font-size:11px;color:#888; }

  .status { padding:10px 12px;border-radius:8px;font-size:12px;margin-bottom:12px;display:flex;align-items:center;gap:8px; }
  .status.detected { background:#e6f4ea;color:#137333; }
  .status.not-detected { background:#f5f5f5;color:#888; }
  .status.has-overrides { background:#e8f0fe;color:#1a73e8; }

  .dot { width:8px;height:8px;border-radius:50%;flex-shrink:0; }
  .dot.green { background:#0e7a0d; }
  .dot.blue { background:#1a73e8; }
  .dot.grey { background:#ccc; }

  .btn { width:100%;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px;transition:opacity .15s;font-family:inherit; }
  .btn:hover { opacity:0.9; }
  .btn:disabled { opacity:0.4;cursor:not-allowed; }
  .btn-primary { background:#0f6cbd;color:#fff; }
  .btn-secondary { background:#f5f5f5;color:#333;border:1px solid #ddd; }
  .btn-danger { background:#fff;color:#b10e1c;border:1px solid #fecdd3; }
  .btn-danger:hover { background:#fef2f2; }

  .divider { height:1px;background:#eee;margin:12px 0; }

  .info { font-size:11px;color:#aaa;text-align:center;line-height:1.4; }
  .info a { color:#0f6cbd;text-decoration:none; }
  .info a:hover { text-decoration:underline; }

  .override-count { font-size:12px;color:#1a73e8;font-weight:500;text-align:center;margin-bottom:8px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">R</div>
  <div>
    <div class="title">RDS Inspector</div>
    <div class="subtitle">Rapid Design System</div>
  </div>
</div>

<div class="status not-detected" id="status">
  <div class="dot grey" id="statusDot"></div>
  <span id="statusText">Checking...</span>
</div>

<div id="overrideInfo" class="override-count" style="display:none;"></div>

<button class="btn btn-primary" id="toggleBtn" disabled>Open Inspector</button>
<button class="btn btn-secondary" id="darkBtn" disabled>Toggle Dark Mode</button>

<div class="divider"></div>

<button class="btn btn-danger" id="resetBtn" style="display:none;">Clear All Overrides</button>

<p class="info">
  Overrides persist per domain.<br>
  <a href="https://github.com/wallissam/Rapid-Design-System" target="_blank">github.com/wallissam/Rapid-Design-System</a>
</p>

<script src="popup.js"></script>
</body>
</html>
