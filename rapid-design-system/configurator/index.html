<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RDS Theme Configurator</title>
<link rel="stylesheet" href="../packages/css/global.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-family: var(--rapid-font-family-base); font-size: 14px; color: var(--rapid-color-text-primary); background: var(--rapid-color-surface-base); line-height: 1.5; transition: background .25s, color .25s; }
body { display: flex; min-height: 100vh; }

/* ── Left: editor ── */
.editor { width: 400px; min-width: 400px; background: var(--rapid-color-surface-raised); border-right: 1px solid var(--rapid-color-border-default); display: flex; flex-direction: column; overflow: hidden; transition: background .25s, border-color .25s; }
.editor-header { padding: 16px 20px; border-bottom: 1px solid var(--rapid-color-border-default); display: flex; align-items: center; justify-content: space-between; }
.editor-logo { font-size: 18px; font-weight: 700; letter-spacing: .15em; color: var(--rapid-color-brand-primary); }
.editor-sub { font-size: 11px; color: var(--rapid-color-text-secondary); }
.mode-row { display: flex; align-items: center; gap: 8px; }
.mode-btn { padding: 4px 12px; font-size: 11px; font-weight: 600; border-radius: 4px; border: 1px solid var(--rapid-color-border-default); background: var(--rapid-color-surface-base); color: var(--rapid-color-text-primary); cursor: pointer; font-family: inherit; }
.mode-btn.active { background: var(--rapid-color-brand-primary); color: var(--rapid-color-text-on-brand); border-color: var(--rapid-color-brand-primary); }

/* Tabs */
.tabs { display: flex; border-bottom: 1px solid var(--rapid-color-border-default); background: var(--rapid-color-surface-raised); }
.tab { flex: 1; padding: 10px 0; text-align: center; font-size: 11px; font-weight: 600; letter-spacing: .03em; color: var(--rapid-color-text-secondary); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: inherit; transition: all .15s; }
.tab:hover { color: var(--rapid-color-text-primary); }
.tab.active { color: var(--rapid-color-brand-primary); border-bottom-color: var(--rapid-color-brand-primary); }

/* Panels */
.panel { display: none; overflow-y: auto; flex: 1; padding: 16px 20px; }
.panel.active { display: block; }
.group-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--rapid-color-text-secondary); padding: 8px 0 4px; }
.row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
.row-label { flex: 1; font-size: 12px; }
.row-swatch { width: 24px; height: 24px; border-radius: 4px; border: 1px solid var(--rapid-color-border-default); flex-shrink: 0; }
.row-input { width: 72px; padding: 3px 6px; font-size: 11px; font-family: 'SF Mono', Consolas, monospace; border: 1px solid var(--rapid-color-border-default); border-radius: 4px; background: var(--rapid-color-surface-base); color: var(--rapid-color-text-primary); }
.row-input:focus { outline: none; border-color: var(--rapid-color-brand-primary); }
.row-picker { width: 28px; height: 24px; border: 1px solid var(--rapid-color-border-default); border-radius: 4px; padding: 0; cursor: pointer; background: none; flex-shrink: 0; -webkit-appearance: none; }
.row-picker::-webkit-color-swatch-wrapper { padding: 0; }
.row-picker::-webkit-color-swatch { border: none; border-radius: 3px; }

/* Preset bar */
.preset-bar { padding: 12px 20px; border-bottom: 1px solid var(--rapid-color-border-default); }
.preset-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--rapid-color-text-secondary); margin-bottom: 6px; }
.preset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.preset-chip { padding: 6px 0; text-align: center; font-size: 11px; font-weight: 500; border-radius: 6px; border: 1px solid var(--rapid-color-border-default); background: var(--rapid-color-surface-base); color: var(--rapid-color-text-primary); cursor: pointer; font-family: inherit; transition: all .15s; }
.preset-chip:hover { border-color: var(--rapid-color-brand-primary); }
.preset-chip.active { background: var(--rapid-color-brand-primary); color: var(--rapid-color-text-on-brand); border-color: var(--rapid-color-brand-primary); }

/* ── Right: preview + export ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.preview-bar { padding: 12px 20px; border-bottom: 1px solid var(--rapid-color-border-default); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.preview-bar-title { font-weight: 600; font-size: 13px; }
.export-btn { padding: 6px 16px; font-size: 12px; font-weight: 600; border-radius: 6px; border: none; cursor: pointer; font-family: inherit; transition: opacity .15s; }
.export-btn:hover { opacity: .9; }
.export-btn.primary { background: var(--rapid-color-brand-primary); color: var(--rapid-color-text-on-brand); }
.export-btn.outline { background: none; border: 1px solid var(--rapid-color-border-default); color: var(--rapid-color-text-primary); }

.preview-area { flex: 1; overflow-y: auto; padding: 24px; }

/* Preview components */
.preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 860px; }
.p-card { background: var(--rapid-color-surface-raised); border: 1px solid var(--rapid-color-border-default); border-radius: var(--rapid-radius-lg); padding: 16px; transition: all .25s; }
.p-card:hover { box-shadow: var(--rapid-shadow-md); }
.p-title { font-weight: 600; margin-bottom: 8px; font-size: 13px; }
.p-text { font-size: 12px; color: var(--rapid-color-text-secondary); line-height: 1.5; }
.p-btn { display: inline-block; padding: 6px 14px; font-size: 12px; font-weight: 600; border-radius: var(--rapid-radius-md); border: none; cursor: pointer; margin-top: 10px; margin-right: 6px; font-family: inherit; }
.p-btn-primary { background: var(--rapid-color-brand-primary); color: var(--rapid-color-text-on-brand); }
.p-btn-outline { background: none; border: 1px solid var(--rapid-color-border-strong); color: var(--rapid-color-text-primary); }
.p-btn-danger { background: var(--rapid-color-status-danger); color: #fff; }
.p-btn-success { background: var(--rapid-color-status-success); color: #fff; }
.p-input { width: 100%; padding: 7px 10px; border: 1px solid var(--rapid-color-border-default); border-radius: var(--rapid-radius-md); font-size: 12px; font-family: inherit; background: var(--rapid-color-surface-base); color: var(--rapid-color-text-primary); margin-top: 8px; }
.p-input:focus { outline: none; border-color: var(--rapid-color-brand-primary); }
.p-badge { display: inline-block; padding: 2px 8px; font-size: 10px; font-weight: 600; border-radius: 999px; }
.p-swatches { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.p-swatch { width: 28px; height: 28px; border-radius: 4px; border: 1px solid rgba(0,0,0,.08); }
.p-alert { padding: 8px 12px; border-radius: var(--rapid-radius-md); font-size: 12px; border-left: 3px solid; margin-top: 6px; }
.p-progress { width: 100%; height: 6px; border-radius: 999px; background: var(--rapid-color-surface-overlay); overflow: hidden; margin-top: 8px; }
.p-progress-fill { height: 100%; border-radius: 999px; }

/* Export modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 9999; display: none; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--rapid-color-surface-base); border-radius: 12px; box-shadow: 0 16px 48px rgba(0,0,0,.2); width: 600px; max-width: 90vw; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--rapid-color-border-default); display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-weight: 600; font-size: 15px; }
.modal-close { width: 28px; height: 28px; border: none; background: var(--rapid-color-surface-overlay); border-radius: 6px; cursor: pointer; font-size: 16px; color: var(--rapid-color-text-secondary); display: flex; align-items: center; justify-content: center; }
.modal-tabs { display: flex; border-bottom: 1px solid var(--rapid-color-border-default); }
.modal-tab { flex: 1; padding: 10px 0; text-align: center; font-size: 11px; font-weight: 600; letter-spacing: .03em; color: var(--rapid-color-text-secondary); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: inherit; }
.modal-tab.active { color: var(--rapid-color-brand-primary); border-bottom-color: var(--rapid-color-brand-primary); }
.modal-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
.code-block { width: 100%; min-height: 200px; padding: 12px; font-family: 'SF Mono', Consolas, monospace; font-size: 11px; line-height: 1.5; border: 1px solid var(--rapid-color-border-default); border-radius: 6px; background: var(--rapid-color-surface-raised); color: var(--rapid-color-text-primary); resize: vertical; }
.copy-btn { margin-top: 10px; padding: 8px 20px; font-size: 12px; font-weight: 600; border-radius: 6px; border: none; background: var(--rapid-color-brand-primary); color: var(--rapid-color-text-on-brand); cursor: pointer; font-family: inherit; }
.copy-btn:hover { opacity: .9; }
.copy-hint { font-size: 11px; color: var(--rapid-color-text-secondary); margin-top: 8px; line-height: 1.5; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 8px 20px; background: var(--rapid-color-text-primary); color: var(--rapid-color-surface-base); font-size: 12px; font-weight: 500; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 99999; }
.toast.show { opacity: 1; }

@media (max-width: 900px) {
  body { flex-direction: column; }
  .editor { width: 100%; min-width: 0; max-height: 50vh; }
  .preview-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ── EDITOR ── -->
<aside class="editor">
  <div class="editor-header">
    <div>
      <div class="editor-logo">RDS</div>
      <div class="editor-sub">Theme Configurator</div>
    </div>
    <div class="mode-row">
      <button class="mode-btn active" id="modeLight">Light</button>
      <button class="mode-btn" id="modeDark">Dark</button>
    </div>
  </div>

  <div class="preset-bar">
    <div class="preset-label">Start from a preset</div>
    <div class="preset-grid" id="presetGrid"></div>
  </div>

  <div class="tabs" id="editorTabs"></div>
  <div id="editorPanels"></div>
</aside>

<!-- ── MAIN ── -->
<div class="main">
  <div class="preview-bar">
    <span class="preview-bar-title">Live Preview</span>
    <div>
      <button class="export-btn outline" id="importBtn">Import JSON</button>
      <button class="export-btn primary" id="exportBtn">Export Theme</button>
    </div>
  </div>
  <div class="preview-area">
    <div class="preview-grid" id="previewGrid"></div>
  </div>
</div>

<!-- ── EXPORT MODAL ── -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Export Theme</span>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-tabs" id="modalTabs"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

    for (const name of Object.keys(presets)) {
      const chip = document.createElement("button");
      chip.className = name === activePreset ? "preset-chip active" : "preset-chip";
      chip.textContent = name;
      chip.addEventListener("click", () => {
        activePreset = name;
        const p = presets[name];
        lightValues = { ...defaults, ...p.l };
        darkValues = { ...defaults, ...darkDefaults, ...p.d };
        applyToDOM();
        renderPresets();
        renderEditorPanels();
      });
      grid.appendChild(chip);
    }
  }

  // ── Editor ──
  function renderEditorTabs() {
    const tabBar = document.getElementById("editorTabs");
    const panels = document.getElementById("editorPanels");
    tabBar.textContent = "";
    const categories = Object.keys(schema);
    categories.forEach((cat, i) => {
      const btn = document.createElement("button");
      btn.className = i === 0 ? "tab active" : "tab";
      btn.textContent = cat;
      btn.addEventListener("click", () => {
        tabBar.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        btn.classList.add("active");
        panels.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        document.getElementById("panel-" + i).classList.add("active");
      });
      tabBar.appendChild(btn);
    });
  }

  function renderEditorPanels() {
    const panels = document.getElementById("editorPanels");
    const activeIdx = Array.from(panels.querySelectorAll(".panel")).findIndex(p => p.classList.contains("active"));
    panels.textContent = "";
    const vals = isDark ? darkValues : lightValues;

    Object.entries(schema).forEach(([cat, groups], catIdx) => {
      const panel = document.createElement("div");
      panel.className = catIdx === (activeIdx >= 0 ? activeIdx : 0) ? "panel active" : "panel";
      panel.id = "panel-" + catIdx;

      for (const [groupName, tokens] of Object.entries(groups)) {
        const title = document.createElement("div");
        title.className = "group-title";
        title.textContent = groupName;
        panel.appendChild(title);

        for (const [dotPath, label] of tokens) {
          const val = vals[dotPath] || defaults[dotPath];
          const col = isColor(val);
          const row = document.createElement("div");
          row.className = "row";

          if (col) {
            const swatch = document.createElement("div");
            swatch.className = "row-swatch";
            swatch.style.background = val;
            row.appendChild(swatch);
          }

          const lbl = document.createElement("span");
          lbl.className = "row-label";
          lbl.textContent = label;
          row.appendChild(lbl);

          if (col) {
            const hex = document.createElement("input");
            hex.className = "row-input";
            hex.type = "text";
            hex.value = val;
            hex.spellcheck = false;

            const picker = document.createElement("input");
            picker.className = "row-picker";
            picker.type = "color";
            picker.value = HEX.test(val) ? val : "#000000";

            const sync = (v) => {
              if (isDark) darkValues[dotPath] = v;
              else lightValues[dotPath] = v;
              root.style.setProperty(cssVar(dotPath), v);
              const sw = row.querySelector(".row-swatch");
              if (sw) sw.style.background = v;
            };

            picker.addEventListener("input", e => { hex.value = e.target.value; sync(e.target.value); });
            hex.addEventListener("change", e => { const v = e.target.value.trim(); if (HEX.test(v)) { picker.value = v; sync(v); } });
            row.appendChild(hex);
            row.appendChild(picker);
          } else {
            const input = document.createElement("input");
            input.className = "row-input";
            input.type = "text";
            input.value = val;
            input.addEventListener("change", e => {
              const v = e.target.value.trim();
              if (isDark) darkValues[dotPath] = v;
              else lightValues[dotPath] = v;
              root.style.setProperty(cssVar(dotPath), v);
            });
            row.appendChild(input);
          }

          panel.appendChild(row);
        }
      }
      panels.appendChild(panel);
    });
  }

  // ── Preview ──
  function renderPreview() {
    const grid = document.getElementById("previewGrid");
    grid.innerHTML = "";
    const cards = [
      () => { const c = mk("div","p-card"); c.style.gridColumn = "1 / -1"; const t = mk("div","p-title"); t.textContent = "Colour Palette"; const sw = mk("div","p-swatches"); for (const k of ["brand.primary","brand.secondary","brand.tertiary","surface.base","surface.raised","surface.overlay","text.primary","text.secondary","border.default","status.info","status.success","status.warning","status.danger"]) { const s = mk("div","p-swatch"); s.style.background = `var(--rapid-color-${k.replace(/\./g,"-")})`; sw.appendChild(s); } c.appendChild(t); c.appendChild(sw); return c; },
      () => { const c = mk("div","p-card"); const t = mk("div","p-title"); t.textContent = "Buttons"; const b1 = mk("button","p-btn p-btn-primary"); b1.textContent = "Primary"; const b2 = mk("button","p-btn p-btn-outline"); b2.textContent = "Outline"; const b3 = mk("button","p-btn p-btn-success"); b3.textContent = "Success"; const b4 = mk("button","p-btn p-btn-danger"); b4.textContent = "Danger"; c.appendChild(t); c.appendChild(b1); c.appendChild(b2); c.appendChild(b3); c.appendChild(b4); return c; },
      () => { const c = mk("div","p-card"); const t = mk("div","p-title"); t.textContent = "Form"; const i = mk("input","p-input"); i.type = "text"; i.placeholder = "Type here..."; const p = mk("div","p-text"); p.textContent = "Secondary helper text for the input above."; p.style.marginTop = "6px"; c.appendChild(t); c.appendChild(i); c.appendChild(p); return c; },
      () => { const c = mk("div","p-card"); const t = mk("div","p-title"); t.textContent = "Status"; const a1 = mk("div","p-alert"); a1.style.borderColor = "var(--rapid-color-status-info)"; a1.style.color = "var(--rapid-color-status-info)"; a1.style.background = "color-mix(in srgb, var(--rapid-color-status-info) 8%, var(--rapid-color-surface-base))"; a1.textContent = "Informational message"; const a2 = mk("div","p-alert"); a2.style.borderColor = "var(--rapid-color-status-success)"; a2.style.color = "var(--rapid-color-status-success)"; a2.style.background = "color-mix(in srgb, var(--rapid-color-status-success) 8%, var(--rapid-color-surface-base))"; a2.textContent = "Operation completed"; const a3 = mk("div","p-alert"); a3.style.borderColor = "var(--rapid-color-status-danger)"; a3.style.color = "var(--rapid-color-status-danger)"; a3.style.background = "color-mix(in srgb, var(--rapid-color-status-danger) 8%, var(--rapid-color-surface-base))"; a3.textContent = "Something went wrong"; c.appendChild(t); c.appendChild(a1); c.appendChild(a2); c.appendChild(a3); return c; },
      () => { const c = mk("div","p-card"); const t = mk("div","p-title"); t.textContent = "Card Example"; const p = mk("div","p-text"); p.textContent = "This card demonstrates surface, border, text, and shadow tokens working together. Hover to see the shadow."; const badges = mk("div",""); badges.style.cssText = "margin-top:10px;display:flex;gap:4px;"; for (const [label,color] of [["Active","--rapid-color-status-success"],["Pending","--rapid-color-status-warning"],["Error","--rapid-color-status-danger"],["Info","--rapid-color-status-info"]]) { const b = mk("span","p-badge"); b.textContent = label; b.style.background = `var(${color})`; b.style.color = "#fff"; badges.appendChild(b); } c.appendChild(t); c.appendChild(p); c.appendChild(badges); return c; },
      () => { const c = mk("div","p-card"); const t = mk("div","p-title"); t.textContent = "Progress"; const items = [["Build","75","--rapid-color-brand-primary"],["Tests","100","--rapid-color-status-success"],["Coverage","42","--rapid-color-status-warning"]]; for (const [label,pct,color] of items) { const row = mk("div",""); row.style.cssText = "display:flex;justify-content:space-between;font-size:11px;margin-top:8px;"; const l = mk("span",""); l.textContent = label; const v = mk("span",""); v.textContent = pct + "%"; v.style.color = "var(--rapid-color-text-secondary)"; row.appendChild(l); row.appendChild(v); c.appendChild(row); const track = mk("div","p-progress"); const fill = mk("div","p-progress-fill"); fill.style.width = pct + "%"; fill.style.background = `var(${color})`; track.appendChild(fill); c.appendChild(track); } c.appendChild(t); return c; },
    ];
    for (const fn of cards) grid.appendChild(fn());
  }

  function mk(tag, cls) { const el = document.createElement(tag); if (cls) el.className = cls; return el; }

  // ── Mode toggle ──
  document.getElementById("modeLight").addEventListener("click", () => {
    isDark = false;
    document.getElementById("modeLight").classList.add("active");
    document.getElementById("modeDark").classList.remove("active");
    root.removeAttribute("data-theme");
    applyToDOM(); renderEditorPanels();
  });
  document.getElementById("modeDark").addEventListener("click", () => {
    isDark = true;
    document.getElementById("modeDark").classList.add("active");
    document.getElementById("modeLight").classList.remove("active");
    root.setAttribute("data-theme", "dark");
    applyToDOM(); renderEditorPanels();
  });

  // ── Export ──
  function buildBaseJSON() {
    const obj = {};
    for (const [dot, val] of Object.entries(lightValues)) {
      const parts = dot.split(".");
      let c = obj;
      for (let i = 0; i < parts.length - 1; i++) { if (!c[parts[i]]) c[parts[i]] = {}; c = c[parts[i]]; }
      c[parts[parts.length - 1]] = val;
    }
    return obj;
  }
  function buildDarkJSON() {
    const obj = {};
    for (const [dot, val] of Object.entries(darkValues)) {
      if (lightValues[dot] === val) continue;
      const parts = dot.split(".");
      let c = obj;
      for (let i = 0; i < parts.length - 1; i++) { if (!c[parts[i]]) c[parts[i]] = {}; c = c[parts[i]]; }
      c[parts[parts.length - 1]] = val;
    }
    return obj;
  }
  function buildCSS() {
    let css = ":root {\n";
    for (const [dot, val] of Object.entries(lightValues)) { css += `  ${cssVar(dot)}: ${val};\n`; }
    css += "}\n\n[data-theme=\"dark\"] {\n";
    for (const [dot, val] of Object.entries(darkValues)) {
      if (lightValues[dot] !== val) css += `  ${cssVar(dot)}: ${val};\n`;
    }
    css += "}\n";
    return css;
  }
  function buildLocalJSON() {
    const obj = {};
    for (const [dot, val] of Object.entries(lightValues)) {
      if (val !== defaults[dot]) {
        const parts = dot.split(".");
        let c = obj;
        for (let i = 0; i < parts.length - 1; i++) { if (!c[parts[i]]) c[parts[i]] = {}; c = c[parts[i]]; }
        c[parts[parts.length - 1]] = val;
      }
    }
    return obj;
  }

  const exportFormats = [
    { name: "base.json", hint: "Copy into tokens/base.json — the full light theme.", fn: () => JSON.stringify(buildBaseJSON(), null, 2) },
    { name: "dark.json", hint: "Copy into tokens/dark.json — only values that differ from light.", fn: () => JSON.stringify(buildDarkJSON(), null, 2) },
    { name: "local.json", hint: "Copy into tokens/local.json — only your changes from the RDS defaults.", fn: () => JSON.stringify(buildLocalJSON(), null, 2) },
    { name: "CSS Variables", hint: "Drop into any stylesheet. Includes :root (light) and [data-theme=\"dark\"].", fn: buildCSS },
  ];

  document.getElementById("exportBtn").addEventListener("click", () => {
    const overlay = document.getElementById("modalOverlay");
    overlay.classList.add("open");

    const tabBar = document.getElementById("modalTabs");
    const body = document.getElementById("modalBody");
    tabBar.textContent = "";

    exportFormats.forEach((fmt, i) => {
      const tab = document.createElement("button");
      tab.className = i === 0 ? "modal-tab active" : "modal-tab";
      tab.textContent = fmt.name;
      tab.addEventListener("click", () => {
        tabBar.querySelectorAll(".modal-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        renderExport(i);
      });
      tabBar.appendChild(tab);
    });
    renderExport(0);

    function renderExport(idx) {
      body.textContent = "";
      const fmt = exportFormats[idx];
      const code = fmt.fn();
      const textarea = document.createElement("textarea");
      textarea.className = "code-block";
      textarea.value = code;
      textarea.readOnly = true;
      const btn = document.createElement("button");
      btn.className = "copy-btn";
      btn.textContent = "Copy to Clipboard";
      btn.addEventListener("click", () => {
        navigator.clipboard.writeText(code).then(() => showToast("Copied!"));
      });
      const hint = document.createElement("div");
      hint.className = "copy-hint";
      hint.textContent = fmt.hint;
      body.appendChild(textarea);
      body.appendChild(btn);
      body.appendChild(hint);
    }
  });

  document.getElementById("modalClose").addEventListener("click", () => {
    document.getElementById("modalOverlay").classList.remove("open");
  });
  document.getElementById("modalOverlay").addEventListener("click", (e) => {
    if (e.target === e.currentTarget) e.currentTarget.classList.remove("open");
  });

  // ── Import ──
  document.getElementById("importBtn").addEventListener("click", () => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".json";
    input.addEventListener("change", () => {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          function flatten(obj, prefix) {
            for (const [k, v] of Object.entries(obj)) {
              const path = prefix ? prefix + "." + k : k;
              if (typeof v === "object" && v !== null) flatten(v, path);
              else if (lightValues.hasOwnProperty(path)) lightValues[path] = String(v);
            }
          }
          flatten(data, "");
          applyToDOM();
          renderEditorPanels();
          showToast("Imported!");
        } catch { showToast("Invalid JSON"); }
      };
      reader.readAsText(file);
    });
    input.click();
  });

  // ── Init ──
  renderPresets();
  renderEditorTabs();
  renderEditorPanels();
  renderPreview();
  applyToDOM();
})();
</script>
</body>
</html>
