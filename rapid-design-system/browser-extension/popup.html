<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 280px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 13px;
    color: #222;
    background: #fff;
    padding: 16px;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .logo {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #0f6cbd;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    flex-shrink: 0;
  }

  .title { font-weight: 600; font-size: 14px; }
  .subtitle { font-size: 11px; color: #888; }

  .status {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 12px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status.detected {
    background: #e6f4ea;
    color: #137333;
  }

  .status.not-detected {
    background: #f5f5f5;
    color: #888;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dot.green { background: #0e7a0d; }
  .dot.grey { background: #ccc; }

  .btn {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 8px;
    transition: opacity .15s;
  }

  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-primary {
    background: #0f6cbd;
    color: #fff;
  }

  .btn-secondary {
    background: #f5f5f5;
    color: #333;
    border: 1px solid #ddd;
  }

  .info {
    font-size: 11px;
    color: #aaa;
    text-align: center;
    margin-top: 4px;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">R</div>
  <div>
    <div class="title">RDS Inspector</div>
    <div class="subtitle">Rapid Design System</div>
  </div>
</div>

<div class="status not-detected" id="status">
  <div class="dot grey" id="statusDot"></div>
  <span id="statusText">Checking...</span>
</div>

<button class="btn btn-primary" id="toggleBtn" disabled>Open Inspector</button>
<button class="btn btn-secondary" id="resetBtn" disabled>Reset All Overrides</button>

<p class="info">
  Overrides are saved per domain and re-applied automatically on page load.
</p>

<script src="popup.js"></script>
</body>
</html>
