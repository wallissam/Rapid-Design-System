name: Tests

on:
  push:
    branches: [main, "cursor/*"]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build tokens
        working-directory: rapid-design-system
        run: node scripts/build-tokens.js
      - name: Run unit tests
        working-directory: rapid-design-system
        run: node --test tests/unit/*.test.js

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: rapid-design-system
        run: npm install
      - name: Install Playwright browsers
        working-directory: rapid-design-system
        run: npx playwright install --with-deps chromium
      - name: Build tokens
        working-directory: rapid-design-system
        run: node scripts/build-tokens.js
      - name: Run E2E tests
        working-directory: rapid-design-system
        run: npx playwright test
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: rapid-design-system/playwright-report/
          retention-days: 7

  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build tokens
        working-directory: rapid-design-system
        run: node scripts/build-tokens.js
      - name: WCAG contrast check
        working-directory: rapid-design-system
        run: node scripts/check-contrast.js
      - name: Token audit (demo page)
        working-directory: rapid-design-system
        run: node scripts/audit-tokens.js ./demo
